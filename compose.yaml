services:
  qr-app:
    build: .
    command: uv run flask run --reload --host=0.0.0.0 --port=5000
    ports:
      - "5001:5000"
    environment:
      FLASK_APP: main:app
      FLASK_DEBUG: "1"
      SCAN_TOKEN: ${SCAN_TOKEN:-SCANMEPODS}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-QRPODSEXODASH}
      SECRET_KEY: ${SECRET_KEY:-QRPODSSECRETPASS}
      NAMESPACE: ${NAMESPACE:-default}
      APP_URL: ${APP_URL:-http://localhost:5001}
      KUBECONFIG: /kubeconfig
    volumes:
      - $PWD/kubeconfig:/kubeconfig:ro
    develop:
      watch:
        - action: sync
          path: ./app/static
          target: /app/static
        - action: sync+restart
          path: ./app
          target: /app
          ignore:
            - static/
        - action: rebuild
          path: ./app/pyproject.toml
