apiVersion: v1
kind: ServiceAccount
metadata:
  name: qr-app-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qr-app-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "list", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qr-app-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: qr-app-sa
  namespace: default
roleRef:
  kind: Role
  name: qr-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qr-app-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qr-app-node-reader-binding
subjects:
- kind: ServiceAccount
  name: qr-app-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: qr-app-node-reader
  apiGroup: rbac.authorization.k8s.io
