apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-app
  namespace: default
  labels:
    app: qr-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qr-app
  template:
    metadata:
      labels:
        app: qr-app
    spec:
      serviceAccountName: qr-app-sa
      containers:
      - name: qr-app
        image: qr-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: qr-app-secret
              key: auth-token
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: APP_URL
          value: "http://localhost:5000"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
