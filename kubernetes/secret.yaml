apiVersion: v1
kind: Secret
metadata:
  name: qr-app-secret
  namespace: default
type: Opaque
data:
  auth-token: REPLACE_WITH_BASE64_ENCODED_TOKEN
---
# To generate a secure token and encode it:
# 1. Generate token: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# 2. Encode to base64: echo -n "YOUR_TOKEN_HERE" | base64
# 3. Replace REPLACE_WITH_BASE64_ENCODED_TOKEN above with the base64 encoded value
#
# Example:
# Token: abc123xyz
# Base64: echo -n "abc123xyz" | base64
# Result: YWJjMTIzeHl6
