<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Me Maybe - QR Pod Scaling</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="big-screen-container">
        <img src="{{ url_for('static', filename='images/exoscale_logo.png') }}" class="exoscale-logo" alt="Exoscale">
        <header class="big-screen-header">
            <h1>Scan Me Maybe</h1>
            <p class="subtitle">Scaling my Pods with Karpenter</p>
        </header>

        <div class="main-content">
            <!-- Left Column: QR Code -->
            <div class="qr-column">
                <div class="qr-card">
                    <h2>Create Pods</h2>
                    <div id="qrcode" class="qr-code-display"></div>
                    <p style="color: #DA2A1B; font-size: 1rem; margin-top: 5px;">Each scan creates a random number</p>
                    <!--<p class="qr-instructions">Scan with your phone to create 1-10 random pods</p>-->
                </div>
            </div>

            <!-- Center Column: Visualization -->
            <div class="visualization-column">
                <div id="scaling-icon" class="scaling-icon-big">
                    <img src="{{ url_for('static', filename='images/kubernetes.png') }}" alt="Kubernetes">
                </div>
            </div>

            <!-- Right Column: Metrics -->
            <div class="metrics-column">
                <div class="metric-card metric-pods">
                    <div class="metric-label">Pods</div>
                    <div class="metric-split-row no-details" id="metric-pods-row">
                        <div class="metric-split-main">
                            <div class="metric-value" id="pod-count">0</div>
                        </div>
                        <div class="metric-detail-list">
                            <div class="metric-detail-item"><span>Pending</span><span class="metric-detail-count metric-detail-highlight" id="pod-pending">0</span></div>
                            <div class="metric-detail-item"><span>Running</span><span class="metric-detail-count" id="pod-running">0</span></div>
                            <div class="metric-detail-item hidden" id="pod-crashing-row"><span>Crashing</span><span class="metric-detail-count metric-detail-warn" id="pod-crashing">0</span></div>
                        </div>
                    </div>
                </div>

                <div class="metric-card metric-nodes">
                    <div class="metric-label">Nodes</div>
                    <div class="metric-split-row no-details" id="metric-nodes-row">
                        <div class="metric-split-main">
                            <div class="metric-value" id="node-count">0</div>
                        </div>
                        <div class="metric-detail-list" id="node-type-list"></div>
                    </div>
                </div>

                <div class="metric-card metric-price">
                    <div class="metric-label">Costs <button type="button" class="info-icon" id="cost-info-btn" aria-label="Show cost breakdown">ⓘ</button></div>
                    <div class="metric-detail-list metric-detail-list-centered">
                        <div class="metric-detail-item"><span>Hourly</span><span class="metric-detail-count" id="hourly-price">€0.00</span></div>
                        <div class="metric-detail-item"><span>Daily</span><span class="metric-detail-count" id="daily-price">€0.00</span></div>
                        <div class="metric-detail-item"><span>Monthly</span><span class="metric-detail-count" id="monthly-price">€0.00</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="nodepool-bar">
            <div class="nodepool-row">
                <span class="np-bar-label">Capacity<span class="np-limit">/Limits</span></span>
                <div class="np-resource">
                    <div class="np-value-group">
                        <span class="np-value" id="np-cpu">—</span>
                        <span class="np-limit" id="np-limit-cpu"></span>
                    </div>
                    <span class="np-unit">CPU</span>
                </div>
                <div class="np-resource">
                    <div class="np-value-group">
                        <span class="np-value" id="np-memory">—</span>
                        <span class="np-limit" id="np-limit-memory"></span>
                    </div>
                    <span class="np-unit">Memory</span>
                </div>
                <div class="np-resource">
                    <span class="np-value" id="np-pods">—</span>
                    <span class="np-unit">Pods</span>
                </div>
            </div>
        </div>

        <!--<footer class="big-screen-footer">
            <div class="status-indicator">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-label">Live Updates Active</span>
            </div>
        </footer>
        //-->
    </div>

    <div class="modal-overlay" id="cost-modal-overlay">
        <div class="modal-box">
            <button type="button" class="modal-close" id="cost-modal-close" aria-label="Close">&times;</button>
            <h3>Cost Breakdown</h3>
            <div class="invoice-table" id="cost-invoice-table"></div>
        </div>
    </div>

    <script>
        const SCAN_URL = "{{ scan_url }}";
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
