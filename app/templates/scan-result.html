<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Result - QR Pod Scaling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .exoscale-logo {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            height: 70px;
            width: auto;
        }

        .result-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 80px 40px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 3rem;
            /*color: #667eea;*/
            color: #DA2A1B;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .message {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
        }

        .pod-count {
            font-size: 5rem;
            font-weight: bold;
            /*background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);*/
            background: #DA2A1B;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .pod-label {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .pod-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .pod-name {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #667eea;
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .pod-name:last-child {
            border-bottom: none;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .info-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #999;
        }

        @media (max-width: 768px) {
            .result-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .pod-count {
                font-size: 4rem;
            }

            .message {
                font-size: 1.2rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <img src="{{ url_for('static', filename='images/exoscale_logo.png') }}" class="exoscale-logo" alt="Exoscale">
    <div class="result-container">
        <!--<div class="success-icon">🚀</div>-->

        <h1>WOW!</h1>

        <p class="message">You created</p>

        <div class="pod-count">{{ pod_count }}</div>

        <p class="pod-label">Pod{{ 's' if pod_count != 1 else '' }}</p>

        <!--
        {% if pod_names %}
        <div class="pod-list">
            {% for pod_name in pod_names %}
            <div class="pod-name">{{ pod_name }}</div>
            {% endfor %}
        </div>
        {% endif %}
        -->

        <div class="button-group">
            <!--<a href="/" class="btn btn-primary">View Dashboard</a>-->
            <a href="/scan?token={{ token }}" class="btn btn-secondary">Create More Pods</a>
        </div>

        <!--
        <p class="info-text">
            Pods are running in the <strong>{{ namespace }}</strong> namespace
        </p>
        -->
    </div>
</body>
</html>
