# Application configuration
app:
  url: "qrpods.exoscale.dev"
  namespace: default
  replicas: 1
  tls: true

# TTL-based cleanup of qr-scan deployments
ttlCleanup:
  enabled: true
  schedule: "*/1 * * * *"
  ttlSeconds: 360

# Image configuration
image:
  registry: ghcr.io
  repository: lucj/qrpod
  tag: v1.0.6
  pullPolicy: IfNotPresent

# App resources
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 1Gi
