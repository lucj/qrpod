# Application configuration
app:
  # The public URL of your application (update after deployment)
  url: "http://localhost:5000"

  # Authentication token
  authToken: "1234567890"

  # Kubernetes namespace for pod creation
  namespace: default

  # Number of app replica
  replicas: 1

# Image configuration
image:
  repository: ghcr.io/lucj/qrpod
  tag: v1.0.0
  pullPolicy: IfNotPresent

# Registry access
registry:
  url: ghcr.io
  user: ""
  pass: ""
  email: ""

# App resources
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# RBAC configuration
rbac:
  create: true
  serviceAccount:
    name: qr-app-sa

# Pod configuration for created demo pods
demoPods:
  image: nginx:alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
