apiVersion: v1
kind: ServiceAccount
metadata:
  name: qrpods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qrpods-pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "list", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qrpods
subjects:
- kind: ServiceAccount
  name: qrpods
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: qrpods-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qrpods-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list", "get"]
- apiGroups: ["karpenter.sh"]
  resources: ["nodepools", "nodeclaims"]
  verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qrpods-node-reader
subjects:
- kind: ServiceAccount
  name: qrpods
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: qrpods-node-reader
  apiGroup: rbac.authorization.k8s.io