apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qr-pods.fullname" . }}
  labels:
    {{- include "qr-pods.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: qrpods
  template:
    metadata:
      labels:
        app: qrpods
    spec:
      serviceAccountName: {{ include "qr-pods.serviceAccountName" . }}
      imagePullSecrets:
      - name: registry
      containers:
      - name: qr-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "qr-pods.fullname" . }}
              key: auth-token
        - name: NAMESPACE
          value: {{ .Values.app.namespace | quote }}
        - name: APP_URL
          value: {{ .Values.app.url | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
