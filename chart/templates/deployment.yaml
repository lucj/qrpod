apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrpods
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: qrpods-ui
  template:
    metadata:
      labels:
        app: qrpods-ui
    spec:
      serviceAccountName: qrpods
      imagePullSecrets:
      - name: registry
      containers:
      - name: qrpods
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: qrpods
              key: auth-token
        - name: NAMESPACE
          value: {{ .Values.app.namespace | quote }}
        - name: APP_URL
          value: "{{ if .Values.app.tls }}https{{ else }}http{{ end }}://{{ .Values.app.url }}"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist